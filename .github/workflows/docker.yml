name: Build and Push Docker Image

on:
  push:
    branches:
      - assignment-04

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Doppler CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y curl
          curl -Ls https://cli.doppler.com/install.sh | sudo sh

      - name: Load secrets from Doppler
        run: |
          doppler secrets download --no-file --format env > doppler.env
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

      - name: Export env vars
        run: |
          set -a
          source doppler.env
          set +a
          echo "DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME" >> $GITHUB_ENV
          echo "DOCKERHUB_TOKEN=$DOCKERHUB_TOKEN" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push (latest + SHA)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/ejercicio4:latest
            ${{ env.DOCKERHUB_USERNAME }}/ejercicio4:${{ github.sha }}
